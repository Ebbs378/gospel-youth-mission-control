<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gospel Youth Mission Control</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--glass:rgba(255,255,255,.88);--text:#111;--muted:#74747c;--line:rgba(0,0,0,.08);--soft:#ececf1;--accent:#111;--good:#30d158;--warn:#ff9f0a;--bad:#ff453a;--shadow:0 18px 60px rgba(0,0,0,.08)}html[data-theme=dark]{--bg:#09090b;--panel:#1c1c1e;--glass:rgba(28,28,30,.9);--text:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.09);--soft:#26262b;--accent:#fff;--shadow:0 18px 60px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.glass{background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line)}.logo{width:118px;height:54px;object-fit:contain}html[data-theme=dark] .logo{filter:invert(1)}.btn{padding:11px 14px;border-radius:999px;background:var(--soft);color:var(--text);font-weight:650}.primary{background:var(--accent);color:var(--bg)}.danger{background:rgba(255,69,58,.12);color:var(--bad)}.small{padding:8px 10px;font-size:12px}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:8px}main{max-width:1180px;margin:auto;padding:22px 14px 110px}.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}h1,h2,h3{margin:0;letter-spacing:-.035em}h1{font-size:34px}h2{font-size:26px}p{color:var(--muted);line-height:1.5}.event{padding:18px 2px}.subtitle{font-size:18px;color:var(--muted);margin-top:6px}.social,.days{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.social a{text-decoration:none;white-space:nowrap}.day{min-width:116px;padding:12px;border-radius:17px;background:var(--glass);color:var(--muted);border:1px solid var(--line);text-align:left}.day.active{color:var(--text);border-color:var(--text)}.day strong,.day small{display:block}.day small{margin-top:4px}.now{padding:20px;border-radius:25px;margin:6px 0 26px;background:radial-gradient(circle at 92% 8%,rgba(10,132,255,.18),transparent 32%),var(--glass);box-shadow:var(--shadow)}.now h2{font-size:29px;margin-top:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 8px;border-radius:999px;background:var(--soft);font-size:11px;color:var(--muted)}.part{margin-top:34px}.parthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.parthead span{font-size:12px;color:var(--muted)}.cards{display:grid;gap:12px}.card{padding:18px;border-radius:23px;box-shadow:var(--shadow)}.phead{display:grid;grid-template-columns:60px 1fr;gap:12px;min-height:64px}.ptime{font-size:18px;font-weight:800}.ptitle{font-size:20px;min-height:25px}.speaker{font-size:12px;color:var(--muted);margin-top:6px}.assigns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:14px}.assign{padding:10px;border-radius:14px;background:var(--soft)}.assign span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}.assign strong{font-size:13px}.tasks,.contents{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.task{display:flex;justify-content:space-between;gap:10px;padding:9px 0}.task+.task{border-top:1px solid var(--line)}.task small{display:block;color:var(--muted);margin-top:3px}.content{padding:12px;border-radius:15px;background:var(--soft);margin-top:8px}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.media img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.caption{font-size:11px;color:var(--muted)}.view{display:none}.view.active{display:block}.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 0 16px}.gallery,.teamgrid,.admingrid{display:grid;gap:12px}.gallerycard,.member,.admincard{border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:linear-gradient(145deg,#5966ff,#70cfff)}.body{padding:16px}.member{padding:15px;display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.bottom button{background:transparent;color:var(--muted);padding:8px;font-size:11px}.bottom .active{color:var(--text);font-weight:800}.login,.adminhero{padding:20px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:14px}.admintabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.admintab.active{background:var(--accent);color:var(--bg)}.adminpanel{display:none}.adminpanel.active{display:block}.admincard{padding:16px}.admincard p{font-size:13px}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.58);display:grid;align-items:end}.sheet{background:var(--panel);padding:20px 16px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;max-height:92vh;overflow:auto}.mtop{display:flex;justify-content:space-between;align-items:center}.fields{display:grid;gap:11px;margin-top:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--text)}.field textarea{min-height:90px}.formactions{display:flex;gap:8px;margin-top:15px}.formactions button{flex:1}.notice{padding:13px;border-radius:15px;background:var(--soft);color:var(--muted);font-size:12px}
@media(min-width:760px){main{padding:28px 22px 90px}h1{font-size:44px}.cards{grid-template-columns:repeat(2,1fr);align-items:start}.assigns{grid-template-columns:repeat(4,1fr)}.gallery,.teamgrid,.admingrid{grid-template-columns:repeat(2,1fr)}.modal{align-items:center}.sheet{width:min(720px,calc(100% - 32px));margin:auto;border-radius:28px;padding:24px}.fields.two{grid-template-columns:repeat(2,1fr)}.full{grid-column:1/-1}}@media(min-width:1080px){.cards{grid-template-columns:repeat(3,1fr)}.gallery{grid-template-columns:repeat(3,1fr)}}
</style>
</head><body>
<header class="top"><div class="topin"><img src="logo.webp" class="logo"><div class="actions"><button class="btn" onclick="theme()">◐</button><button class="btn" onclick="show('admin')">🔒 Admin</button></div></div></header>
<main>
<section class="event"><div class="kicker" id="intro"></div><h1 id="eventTitle"></h1><div class="subtitle" id="eventSubtitle"></div></section>
<div class="social"><a id="instagram" class="btn small" target="_blank">Instagram öffnen ↗</a><a id="tiktok" class="btn small" target="_blank">TikTok öffnen ↗</a></div>
<div id="dayStrip" class="days"></div>
<section id="view-today" class="view active"><div id="now" class="now glass"></div><div id="parts"></div></section>
<section id="view-days" class="view"><div class="sectionhead"><div><h2>Tage</h2><p>Wähle oben einen Tag und sieh Morgen, Mittag und Abend.</p></div></div><div class="notice">Alle Tagesansichten sind öffentlich und nur lesbar.</div></section>
<section id="view-content" class="view"><div class="sectionhead"><div><h2>Content</h2><p>Reels, Stories, Fotos und Inspiration.</p></div></div><div id="gallery" class="gallery"></div></section>
<section id="view-team" class="view"><div class="sectionhead"><div><h2>Team</h2><p>Mitarbeiter und Rollen.</p></div></div><div id="team" class="teamgrid"></div></section>
<section id="view-admin" class="view"><div id="admin"></div></section>
</main>
<nav class="bottom"><button class="active" data-v="today" onclick="show('today',this)">Heute</button><button data-v="days" onclick="show('days',this)">Tage</button><button data-v="content" onclick="show('content',this)">Content</button><button data-v="team" onclick="show('team',this)">Team</button></nav>
<div id="modal" class="modal hidden"><div class="sheet"><div class="mtop"><h3 id="modalTitle"></h3><button class="btn" onclick="closeForm()">×</button></div><div id="form"></div><div class="formactions"><button class="btn" onclick="closeForm()">Abbrechen</button><button class="btn primary" onclick="saveForm()">Speichern</button></div></div></div>
<script>
const DAYS=[["2026-08-29","Sa","29. Aug","Anreise"],["2026-08-30","So","30. Aug","Ankunft"],["2026-08-31","Mo","31. Aug","Identität"],["2026-09-01","Di","1. Sep","Metanoia"],["2026-09-02","Mi","2. Sep","Gaben"],["2026-09-03","Do","3. Sep","Ausflug"],["2026-09-04","Fr","4. Sep","Gnade"],["2026-09-05","Sa","5. Sep","Alltag"],["2026-09-06","So","6. Sep","Zeugnisse"],["2026-09-07","Mo","7. Sep","Heimfahrt"]];
const seed={settings:{event_title:"Sommerfestival 2026",event_subtitle:"Heaven Now",intro:"Social Media Mission Control",heading_morning:"Morgen",heading_midday:"Mittag",heading_evening:"Abend",instagram_url:"https://www.instagram.com/",tiktok_url:"https://www.tiktok.com/"},members:[{id:"m1",name:"Daniel",email:"admin@gospelyouth.de",roles:["Admin","Story-Koordinator"]},{id:"m2",name:"Jonas",email:"jonas@gospelyouth.de",roles:["Fotograf"]},{id:"m3",name:"Mia",email:"mia@gospelyouth.de",roles:["Story-Maker"]},{id:"m4",name:"Max",email:"max@gospelyouth.de",roles:["Reel-Maker"]}],program:[{id:"p1",date:"2026-08-29",time:"15:00",daypart:"midday",title:"Check-in",speaker:"—",desc:"Ankommen im Gospel Forum Stuttgart.",photographer:"Jonas",story_coordinator:"Daniel",story_maker:"Mia",reel_maker:"Max"},{id:"p2",date:"2026-08-29",time:"16:30",daypart:"midday",title:"Gottesdienst",speaker:"Noch offen",desc:"Erwartungen an Gott.",photographer:"Jonas",story_coordinator:"Daniel",story_maker:"Mia",reel_maker:"Max"},{id:"p3",date:"2026-08-29",time:"18:00",daypart:"evening",title:"Abfahrt",speaker:"—",desc:"Busfahrt nach Frankreich.",photographer:"Jonas",story_coordinator:"Daniel",story_maker:"Mia",reel_maker:"Max"}],tasks:[{id:"t1",program_id:"p1",date:"2026-08-29",time:"15:00",title:"Check-in Story",owner:"Mia",role:"Story-Maker",desc:"5–7 Hochformat-Clips und erste Stimmung."},{id:"t2",program_id:"p2",date:"2026-08-29",time:"16:30",title:"Worship fotografieren",owner:"Jonas",role:"Fotograf",desc:"Wide, Details, Gebet und Reaktionen."},{id:"t3",program_id:"p3",date:"2026-08-29",time:"17:30",title:"Abfahrt-Reel schneiden",owner:"Max",role:"Reel-Maker",desc:"20–30 Sekunden; Upload 18:30."}],content:[{id:"c1",program_id:"p3",date:"2026-08-29",kind:"Reel",title:"Wir fahren los",description:"Emotionaler Recap aus Check-in, Gottesdienst und Abfahrt.",owner:"Max",shoot_time:"15:00",publish_time:"18:30",social_url:"https://www.instagram.com/",status:"Geplant",images:[]},{id:"c2",program_id:"p2",date:"2026-08-29",kind:"Foto",title:"Worship Moodboard",description:"Hände, Licht, Close-ups und Gebet.",owner:"Jonas",shoot_time:"16:30",publish_time:"20:00",social_url:"",status:"Geplant",images:[]}]};
let state=JSON.parse(localStorage.getItem('gyV5')||'null')||seed,selected=DAYS[0][0],adminOn=false,editing=null;const $=id=>document.getElementById(id),uid=p=>p+Date.now()+Math.random().toString(16).slice(2,6),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('gyV5',JSON.stringify(state))}function theme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('gyThemeV5',n)}document.documentElement.dataset.theme=localStorage.getItem('gyThemeV5')||'dark';
function show(v,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('view-'+v).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='admin')renderAdmin();if(v==='content')renderContent();if(v==='team')renderTeam()}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'})}function selectDay(d){selected=d;render();show('today')}
function renderHeader(){$('intro').textContent=state.settings.intro;$('eventTitle').textContent=state.settings.event_title;$('eventSubtitle').textContent=state.settings.event_subtitle;$('instagram').href=state.settings.instagram_url||'#';$('tiktok').href=state.settings.tiktok_url||'#'}
function renderDays(){$('dayStrip').innerHTML=DAYS.map(d=>`<button class="day ${d[0]===selected?'active':''}" onclick="selectDay('${d[0]}')"><strong>${d[1]} · ${d[2]}</strong><small>${d[3]}</small></button>`).join('')}
function renderNow(){const ps=state.program.filter(p=>p.date===selected).sort((a,b)=>a.time.localeCompare(b.time)),p=ps[0];$('now').innerHTML=p?`<div class="kicker">Tagesfokus</div><h2>${esc(p.time)} · ${esc(p.title)}</h2><p>${esc(p.desc)}</p><div class="chips"><span class="chip">Sprecher: ${esc(p.speaker)}</span><span class="chip">📸 ${esc(p.photographer||'offen')}</span><span class="chip">📱 ${esc(p.story_maker||'offen')}</span><span class="chip">🎬 ${esc(p.reel_maker||'offen')}</span></div>`:`<div class="kicker">${fmt(selected)}</div><h2>Noch kein Programm</h2><p>Der Admin kann Programmpunkte hinzufügen.</p>`}
function mini(c){return `<div class="content"><div><strong>${esc(c.kind)} · ${esc(c.title)}</strong><div class="caption">Dreh ${esc(c.shoot_time)} · Upload ${esc(c.publish_time)} · ${esc(c.owner)}</div></div><p style="font-size:12px;margin:7px 0">${esc(c.description)}</p>${c.social_url?`<a class="btn small" href="${esc(c.social_url)}" target="_blank">${c.kind==='Reel'?'Beispiel-Reel öffnen':'Social-Beispiel öffnen'} ↗</a>`:''}${(c.images||[]).length?`<div class="media">${c.images.map(i=>`<div><img src="${i.url}"><div class="caption">${esc(i.caption)}</div></div>`).join('')}</div>`:''}</div>`}
function pcard(p){const ts=state.tasks.filter(t=>t.program_id===p.id),cs=state.content.filter(c=>c.program_id===p.id);return `<article class="card glass"><div class="phead"><div class="ptime">${esc(p.time)}</div><div><h3 class="ptitle">${esc(p.title)}</h3><div class="speaker">Sprecher: ${esc(p.speaker||'—')}</div></div></div><p>${esc(p.desc)}</p><div class="assigns"><div class="assign"><span>Fotograf</span><strong>${esc(p.photographer||'Offen')}</strong></div><div class="assign"><span>Story-Koord.</span><strong>${esc(p.story_coordinator||'Offen')}</strong></div><div class="assign"><span>Story-Maker</span><strong>${esc(p.story_maker||'Offen')}</strong></div><div class="assign"><span>Reel-Maker</span><strong>${esc(p.reel_maker||'Offen')}</strong></div></div>${ts.length?`<div class="tasks"><div class="kicker">Aufgaben</div>${ts.map(t=>`<div class="task"><div><strong>${esc(t.time)} · ${esc(t.title)}</strong><small>${esc(t.owner)} · ${esc(t.desc)}</small></div><button class="btn small" onclick='ics(${JSON.stringify(t)})'>Kalender</button></div>`).join('')}</div>`:''}${cs.length?`<div class="contents">${cs.map(mini).join('')}</div>`:''}</article>`}
function renderParts(){const parts=[['morning',state.settings.heading_morning,'06:00–11:59'],['midday',state.settings.heading_midday,'12:00–17:59'],['evening',state.settings.heading_evening,'ab 18:00']];$('parts').innerHTML=parts.map(([k,t,r])=>{const a=state.program.filter(p=>p.date===selected&&p.daypart===k).sort((x,y)=>x.time.localeCompare(y.time));return `<section class="part"><div class="parthead"><h2>${esc(t)}</h2><span>${r}</span></div><div class="cards">${a.length?a.map(pcard).join(''):`<div class="notice">Noch nichts für ${esc(t)} eingetragen.</div>`}</div></section>`}).join('')}
function renderContent(){const a=state.content.filter(c=>c.date===selected);$('gallery').innerHTML=a.length?a.map(c=>{const img=(c.images||[])[0]?.url;return `<article class="gallerycard glass">${img?`<img class="cover" src="${img}">`:`<div class="cover"></div>`}<div class="body"><div class="chips"><span class="chip">${esc(c.kind)}</span><span class="chip">${esc(c.status)}</span></div><h3 style="margin-top:9px">${esc(c.title)}</h3><p>${esc(c.description)}</p>${c.social_url?`<a class="btn small" href="${esc(c.social_url)}" target="_blank">${c.kind==='Reel'?'Beispiel-Reel öffnen':'Social-Beispiel öffnen'} ↗</a>`:''}</div></article>`}).join(''):`<div class="notice">Noch kein Content für diesen Tag.</div>`}
function renderTeam(){$('team').innerHTML=state.members.map(m=>`<div class="member glass"><div class="avatar">${esc(m.name[0])}</div><div><strong>${esc(m.name)}</strong><div class="caption">${esc(m.email)}</div><div class="chips" style="margin-top:5px">${m.roles.map(r=>`<span class="chip">${esc(r)}</span>`).join('')}</div></div></div>`).join('')}
function renderAdmin(){if(!adminOn){$('admin').innerHTML=`<div class="login glass"><div class="kicker">Geschützter Bereich</div><h2 style="margin-top:6px">Admin anmelden</h2><p>Die Teamansicht bleibt ohne Login sichtbar.</p><div class="field"><label>Passwort</label><input id="adminPass" type="password"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="loginAdmin()">Anmelden</button><div class="notice" style="margin-top:10px">Beta-Passwort: missioncontrol</div></div>`;return}$('admin').innerHTML=`<div class="adminhero glass"><div class="kicker">Admin Cockpit</div><h2 style="margin-top:6px">Alles ohne Code bearbeiten.</h2><p>Programm, Rollen, Content, Mitarbeiter, Überschriften und Social-Links.</p><button class="btn small" onclick="adminOn=false;renderAdmin()">Admin verlassen</button></div><div class="admintabs">${[['overview','Übersicht'],['program','Programm'],['content','Content'],['team','Team'],['settings','Einstellungen']].map((x,i)=>`<button class="btn admintab ${i===0?'active':''}" onclick="adminTab('${x[0]}',this)">${x[1]}</button>`).join('')}</div><div id="a-overview" class="adminpanel active"></div><div id="a-program" class="adminpanel"></div><div id="a-content" class="adminpanel"></div><div id="a-team" class="adminpanel"></div><div id="a-settings" class="adminpanel"></div>`;renderAdminPanels()}
function loginAdmin(){if($('adminPass').value!=='missioncontrol'){alert('Falsches Passwort');return}adminOn=true;renderAdmin()}function adminTab(n,b){document.querySelectorAll('.adminpanel').forEach(x=>x.classList.remove('active'));$('a-'+n).classList.add('active');document.querySelectorAll('.admintab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function missing(p){return [p.photographer,p.story_coordinator,p.story_maker,p.reel_maker].filter(x=>!x||x==='Offen').length}
function renderAdminPanels(){$('a-overview').innerHTML=`<div class="admingrid">${DAYS.map(d=>{const ps=state.program.filter(p=>p.date===d[0]),m=ps.reduce((n,p)=>n+missing(p),0);return `<div class="admincard glass"><h3>${d[1]} · ${d[2]}</h3><p>${d[3]} · ${ps.length} Programmpunkte<br>${m?m+' Rollen offen':'Alle Rollen besetzt'}</p><button class="btn small" onclick="selectDay('${d[0]}')">Tag ansehen</button></div>`}).join('')}</div>`;$('a-program').innerHTML=`<div class="sectionhead"><div><h2>Programm</h2></div><button class="btn primary" onclick="openForm('program')">+ Programmpunkt</button></div><div class="admingrid">${state.program.map(p=>`<div class="admincard glass"><h3>${p.date} · ${p.time} · ${esc(p.title)}</h3><p>Sprecher: ${esc(p.speaker)}<br>${esc(p.desc)}</p><div class="actions"><button class="btn small" onclick="openForm('program','${p.id}')">Bearbeiten</button><button class="btn small" onclick="openForm('task',null,'${p.id}')">+ Aufgabe</button><button class="btn small danger" onclick="remove('program','${p.id}')">Löschen</button></div></div>`).join('')}</div>`;$('a-content').innerHTML=`<div class="sectionhead"><div><h2>Content</h2></div><button class="btn primary" onclick="openForm('content')">+ Content</button></div><div class="admingrid">${state.content.map(c=>`<div class="admincard glass"><h3>${esc(c.kind)} · ${esc(c.title)}</h3><p>${c.date} · Dreh ${c.shoot_time} · Upload ${c.publish_time}<br>${esc(c.owner)} · ${esc(c.status)}</p><div class="actions"><button class="btn small" onclick="openForm('content','${c.id}')">Bearbeiten</button><button class="btn small danger" onclick="remove('content','${c.id}')">Löschen</button></div></div>`).join('')}</div>`;$('a-team').innerHTML=`<div class="sectionhead"><div><h2>Team</h2></div><button class="btn primary" onclick="openForm('member')">+ Person</button></div><div class="admingrid">${state.members.map(m=>`<div class="admincard glass"><h3>${esc(m.name)}</h3><p>${esc(m.email)}<br>${m.roles.map(esc).join(' · ')}</p><div class="actions"><button class="btn small" onclick="openForm('member','${m.id}')">Bearbeiten</button><button class="btn small danger" onclick="remove('member','${m.id}')">Löschen</button></div></div>`).join('')}</div>`;$('a-settings').innerHTML=`<div class="admincard glass"><h3>${esc(state.settings.event_title)} · ${esc(state.settings.event_subtitle)}</h3><p>Auch Überschriften sowie Instagram-/TikTok-Links sind editierbar.</p><button class="btn primary" onclick="openForm('settings')">Einstellungen bearbeiten</button></div>`}
function opts(sel=''){return `<option value="">Offen</option>`+state.members.map(m=>`<option ${m.name===sel?'selected':''}>${esc(m.name)}</option>`).join('')}function progOpts(sel=''){return state.program.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${p.date} · ${p.time} · ${esc(p.title)}</option>`).join('')}
function openForm(type,id=null,pid=null){editing={type,id,pid};const arr=type==='member'?state.members:state[type]||[],it=id?arr.find(x=>x.id===id):null;let f='',title='';if(type==='program'){title=id?'Programmpunkt bearbeiten':'Programmpunkt hinzufügen';f=`<div class="fields two"><div class="field"><label>Datum</label><input id="fDate" type="date" value="${it?.date||selected}"></div><div class="field"><label>Uhrzeit</label><input id="fTime" type="time" value="${it?.time||'10:00'}"></div><div class="field"><label>Tageszeit</label><select id="fPart">${[['morning','Morgen'],['midday','Mittag'],['evening','Abend']].map(x=>`<option value="${x[0]}" ${it?.daypart===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Sprecher</label><input id="fSpeaker" value="${esc(it?.speaker||'')}"></div><div class="field full"><label>Überschrift</label><input id="fTitle" value="${esc(it?.title||'')}"></div><div class="field full"><label>Beschreibung</label><textarea id="fDesc">${esc(it?.desc||'')}</textarea></div><div class="field"><label>Fotograf</label><select id="fPhoto">${opts(it?.photographer)}</select></div><div class="field"><label>Story-Koordinator</label><select id="fCoord">${opts(it?.story_coordinator)}</select></div><div class="field"><label>Story-Maker</label><select id="fStory">${opts(it?.story_maker)}</select></div><div class="field"><label>Reel-Maker</label><select id="fReel">${opts(it?.reel_maker)}</select></div></div>`}if(type==='task'){title='Aufgabe hinzufügen';f=`<div class="fields"><div class="field"><label>Programmpunkt</label><select id="fProgram">${progOpts(pid)}</select></div><div class="field"><label>Datum</label><input id="fDate" type="date" value="${selected}"></div><div class="field"><label>Uhrzeit</label><input id="fTime" type="time" value="10:00"></div><div class="field"><label>Aufgabe</label><input id="fTitle"></div><div class="field"><label>Person</label><select id="fOwner">${opts()}</select></div><div class="field"><label>Rolle</label><input id="fRole"></div><div class="field"><label>Beschreibung</label><textarea id="fDesc"></textarea></div></div>`}if(type==='content'){title=id?'Content bearbeiten':'Content hinzufügen';f=`<div class="fields two"><div class="field full"><label>Programmpunkt</label><select id="fProgram">${progOpts(it?.program_id)}</select></div><div class="field"><label>Datum</label><input id="fDate" type="date" value="${it?.date||selected}"></div><div class="field"><label>Typ</label><select id="fKind">${['Reel','Story','Foto','Interview'].map(x=>`<option ${it?.kind===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Titel</label><input id="fTitle" value="${esc(it?.title||'')}"></div><div class="field"><label>Drehzeit</label><input id="fShoot" type="time" value="${it?.shoot_time||'10:00'}"></div><div class="field"><label>Uploadzeit</label><input id="fPublish" type="time" value="${it?.publish_time||'18:30'}"></div><div class="field"><label>Verantwortlich</label><select id="fOwner">${opts(it?.owner)}</select></div><div class="field"><label>Status</label><select id="fStatus">${['Geplant','Dreh läuft','Material fertig','Schnitt','Freigabe','Veröffentlicht'].map(x=>`<option ${it?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Instagram-/TikTok-Link</label><input id="fSocial" value="${esc(it?.social_url||'')}"></div><div class="field full"><label>Beschreibung / Shotlist</label><textarea id="fDesc">${esc(it?.description||'')}</textarea></div><div class="field full"><label>Inspirationsbild</label><input id="fImage" type="file" accept="image/*"><input id="fCaption" placeholder="Beschreibung zum Bild" style="margin-top:7px"></div></div>`}if(type==='member'){title=id?'Mitarbeiter bearbeiten':'Mitarbeiter hinzufügen';f=`<div class="fields"><div class="field"><label>Name</label><input id="fName" value="${esc(it?.name||'')}"></div><div class="field"><label>E-Mail</label><input id="fEmail" type="email" value="${esc(it?.email||'')}"></div><div class="field"><label>Rollen, Komma getrennt</label><input id="fRoles" value="${esc((it?.roles||[]).join(', '))}"></div></div>`}if(type==='settings'){const s=state.settings;title='Event & Einstellungen';f=`<div class="fields"><div class="field"><label>Eventname</label><input id="fEvent" value="${esc(s.event_title)}"></div><div class="field"><label>Untertitel</label><input id="fSubtitle" value="${esc(s.event_subtitle)}"></div><div class="field"><label>Intro</label><input id="fIntro" value="${esc(s.intro)}"></div><div class="field"><label>Überschrift Morgen</label><input id="fMorning" value="${esc(s.heading_morning)}"></div><div class="field"><label>Überschrift Mittag</label><input id="fMidday" value="${esc(s.heading_midday)}"></div><div class="field"><label>Überschrift Abend</label><input id="fEvening" value="${esc(s.heading_evening)}"></div><div class="field"><label>Instagram-Link</label><input id="fInstagram" value="${esc(s.instagram_url)}"></div><div class="field"><label>TikTok-Link</label><input id="fTiktok" value="${esc(s.tiktok_url)}"></div></div>`}$('modalTitle').textContent=title;$('form').innerHTML=f;$('modal').classList.remove('hidden')}
function closeForm(){$('modal').classList.add('hidden');editing=null}function val(id){return $(id)?.value||''}function imgData(file,cap){return new Promise(r=>{const x=new FileReader();x.onload=()=>r({url:x.result,caption:cap});x.readAsDataURL(file)})}function up(key,o,id){if(id)state[key]=state[key].map(x=>x.id===id?o:x);else state[key].push(o)}
async function saveForm(){const {type,id}=editing;if(type==='program')up('program',{id:id||uid('p'),date:val('fDate'),time:val('fTime'),daypart:val('fPart'),title:val('fTitle')||'Programmpunkt',speaker:val('fSpeaker')||'—',desc:val('fDesc'),photographer:val('fPhoto'),story_coordinator:val('fCoord'),story_maker:val('fStory'),reel_maker:val('fReel')},id);if(type==='task')state.tasks.push({id:uid('t'),program_id:val('fProgram'),date:val('fDate'),time:val('fTime'),title:val('fTitle')||'Aufgabe',owner:val('fOwner'),role:val('fRole'),desc:val('fDesc')});if(type==='content'){const old=id?state.content.find(x=>x.id===id):null,o={id:id||uid('c'),program_id:val('fProgram'),date:val('fDate'),kind:val('fKind'),title:val('fTitle')||'Content',description:val('fDesc'),owner:val('fOwner'),shoot_time:val('fShoot'),publish_time:val('fPublish'),social_url:val('fSocial'),status:val('fStatus'),images:[...(old?.images||[])]},file=$('fImage')?.files?.[0];if(file)o.images.push(await imgData(file,val('fCaption')));up('content',o,id)}if(type==='member')up('members',{id:id||uid('m'),name:val('fName')||'Neue Person',email:val('fEmail'),roles:val('fRoles').split(',').map(x=>x.trim()).filter(Boolean)},id);if(type==='settings')state.settings={...state.settings,event_title:val('fEvent'),event_subtitle:val('fSubtitle'),intro:val('fIntro'),heading_morning:val('fMorning'),heading_midday:val('fMidday'),heading_evening:val('fEvening'),instagram_url:val('fInstagram'),tiktok_url:val('fTiktok')};save();closeForm();render();renderAdmin()}
function remove(type,id){if(!confirm('Wirklich löschen?'))return;const key=type==='member'?'members':type;state[key]=state[key].filter(x=>x.id!==id);save();render();renderAdmin()}function ics(x){const d=(x.date||selected).replaceAll('-',''),st=(x.time||'12:00').replace(':','')+'00',h=String((+st.slice(0,2)+1)%24).padStart(2,'0'),txt=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${d}T${st}\nDTEND:${d}T${h}${st.slice(2)}\nSUMMARY:${x.title}\nDESCRIPTION:${(x.desc||'').replaceAll('\n',' ')}\nEND:VEVENT\nEND:VCALENDAR`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download=x.title.replaceAll(' ','-')+'.ics';a.click()}
