<script id="gf-v14-admin-js">
(function(){
  const $q=(s,r=document)=>r.querySelector(s);
  const $$q=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const shell=$q('#adminShell'), loginView=$q('#adminLoginView'), dash=$q('#adminDashboard');
  let adminSession=null;

  function openAdmin(){ shell.classList.add('open'); shell.setAttribute('aria-hidden','false'); }
  function closeAdmin(){ shell.classList.remove('open'); shell.setAttribute('aria-hidden','true'); }
  $q('#openAdmin')?.addEventListener('click',openAdmin);
  $q('#closeAdmin')?.addEventListener('click',closeAdmin);
  $q('#adminCancelBtn')?.addEventListener('click',closeAdmin);
  shell?.addEventListener('click',e=>{if(e.target===shell)closeAdmin()});

  async function login(){
    const status=$q('#adminStatus');
    const email=$q('#adminEmail').value.trim(), password=$q('#adminPassword').value;
    if(!email||!password){status.textContent='Bitte E-Mail-Adresse und Passwort eingeben.';return}
    status.textContent='Anmeldung läuft …';
    try{
      const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
        method:'POST',
        headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      });
      const data=await res.json();
      if(!res.ok||!data.access_token) throw new Error(data.error_description||'Anmeldung fehlgeschlagen');
      adminSession=data;
      sessionStorage.setItem('gf_admin_session',JSON.stringify(data));
      loginView.style.display='none'; dash.classList.add('visible'); status.textContent='';
      loadProposals();
    }catch(err){status.textContent='Anmeldung fehlgeschlagen. Bitte Zugangsdaten prüfen.'}
  }

  async function loadProposals(){
    const box=$q('#adminProposalList');
    box.innerHTML='<div class="admin-status">Terminvorschläge werden geladen …</div>';
    try{
      const res=await fetch(SUPABASE_URL+'/rest/v1/calendar_events?select=*&status=eq.pending&order=start_date.asc',{
        headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+adminSession.access_token}
      });
      const rows=await res.json();
      if(!res.ok) throw new Error(rows.message||'Laden fehlgeschlagen');
      if(!rows.length){box.innerHTML='<div class="admin-status">Aktuell gibt es keine offenen Terminvorschläge.</div>';return}
      box.innerHTML=rows.map(r=>`
        <div class="admin-proposal">
          <div><strong>${escapeHtml(r.title||'Ohne Titel')}</strong>
          <small>${escapeHtml(r.start_date||'')} ${r.start_time?'· '+escapeHtml(r.start_time.slice(0,5)):''} · ${escapeHtml(r.category||'')}</small></div>
          <div class="admin-proposal-actions">
            <button class="admin-mini publish" data-publish="${r.id}">Veröffentlichen</button>
            <button class="admin-mini reject" data-reject="${r.id}">Ablehnen</button>
          </div>
        </div>`).join('');
      $$q('[data-publish]',box).forEach(b=>b.onclick=()=>setStatus(b.dataset.publish,'published'));
      $$q('[data-reject]',box).forEach(b=>b.onclick=()=>setStatus(b.dataset.reject,'rejected'));
    }catch(err){box.innerHTML='<div class="admin-status">Terminvorschläge konnten nicht geladen werden.</div>'}
  }

  async function setStatus(id,status){
    try{
      const res=await fetch(SUPABASE_URL+'/rest/v1/calendar_events?id=eq.'+encodeURIComponent(id),{
        method:'PATCH',
        headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+adminSession.access_token,'Content-Type':'application/json'},
        body:JSON.stringify({status})
      });
      if(!res.ok) throw new Error('Update fehlgeschlagen');
      await loadProposals();
      if(typeof loadSupabaseEvents==='function') loadSupabaseEvents();
    }catch(err){alert('Änderung konnte nicht gespeichert werden. Bitte Admin-RLS prüfen.')}
  }

  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

  $q('#adminLoginBtn')?.addEventListener('click',login);
  $q('#adminPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  $q('#adminLogoutBtn')?.addEventListener('click',()=>{
    sessionStorage.removeItem('gf_admin_session');adminSession=null;dash.classList.remove('visible');loginView.style.display='block';
  });

  $$q('[data-admin-tab]').forEach(btn=>btn.addEventListener('click',()=>{
    $$q('[data-admin-tab]').forEach(x=>x.classList.toggle('active',x===btn));
    $q('#adminPanelProposals').style.display=btn.dataset.adminTab==='proposals'?'block':'none';
    $q('#adminPanelCategories').style.display=btn.dataset.adminTab==='categories'?'block':'none';
  }));

  $$q('.category-color').forEach(input=>input.addEventListener('input',()=>{
    document.documentElement.style.setProperty(input.dataset.cssVar,input.value);
    localStorage.setItem('gf_color_'+input.dataset.cssVar,input.value);
  }));
  $$q('.category-color').forEach(input=>{
    const saved=localStorage.getItem('gf_color_'+input.dataset.cssVar);
    if(saved){input.value=saved;document.documentElement.style.setProperty(input.dataset.cssVar,saved)}
  });

  try{
    const saved=JSON.parse(sessionStorage.getItem('gf_admin_session')||'null');
    if(saved?.access_token){adminSession=saved;loginView.style.display='none';dash.classList.add('visible')}
  }catch(e){}

  // Color date boxes based on visible category text/classes.
  function decorateEventRows(){
    $$q('.event-row,.event-item').forEach(row=>{
      const txt=row.textContent.toLowerCase();
      let cat='event';
      if(txt.includes('ferien')) cat='ferien';
      else if(txt.includes('gottesdienst')||txt.includes('sunday')) cat='gottesdienst';
      else if(txt.includes('leiter')||txt.includes('leaders')) cat='leitung';
      row.dataset.category=cat;
    });
  }
  const obs=new MutationObserver(decorateEventRows);
  obs.observe(document.body,{childList:true,subtree:true});
  decorateEventRows();
})();
</script>


<script id="gf-v15-admin-fix">
(function(){
  const q=(s,r=document)=>r.querySelector(s);
  const qa=(s,r=document)=>Array.from(r.querySelectorAll(s));

  const shell=q('#adminShell');
  const openBtn=q('#openAdmin');
  const closeBtn=q('#closeAdmin');
  const cancelBtn=q('#adminCancelBtn');
  const loginBtn=q('#adminLoginBtn');
  const logoutBtn=q('#adminLogoutBtn');
  const loginView=q('#adminLoginView');
  const dashboard=q('#adminDashboard');
  const status=q('#adminStatus');

  function openAdminModal(){
    if(!shell) return;
    shell.classList.add('open');
    shell.setAttribute('aria-hidden','false');
    const email=q('#adminEmail');
    if(email) setTimeout(()=>email.focus(),40);
  }
  function closeAdminModal(){
    if(!shell) return;
    shell.classList.remove('open');
    shell.setAttribute('aria-hidden','true');
  }

  if(openBtn){
    const fresh=openBtn.cloneNode(true);
    openBtn.replaceWith(fresh);
    fresh.addEventListener('click',openAdminModal);
  }
  closeBtn?.addEventListener('click',closeAdminModal);
  cancelBtn?.addEventListener('click',closeAdminModal);
  shell?.addEventListener('click',e=>{ if(e.target===shell) closeAdminModal(); });

  async function doLogin(){
    const email=q('#adminEmail')?.value.trim()||'';
    const password=q('#adminPassword')?.value||'';
    if(!email||!password){
      if(status) status.textContent='Bitte E-Mail-Adresse und Passwort eingeben.';
      return;
    }
    if(status) status.textContent='Anmeldung läuft …';
    try{
      const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,
          'Content-Type':'application/json'
        },
        body:JSON.stringify({email,password})
      });
      const data=await res.json().catch(()=>({}));
      if(!res.ok || !data.access_token){
        throw new Error(data.error_description||data.msg||'Anmeldung fehlgeschlagen');
      }

      // Optional echte Adminprüfung, falls calendar_admins existiert:
      let isAdmin=true;
      try{
        const check=await fetch(
          SUPABASE_URL+'/rest/v1/calendar_admins?user_id=eq.'+encodeURIComponent(data.user.id)+'&select=user_id',
          {headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+data.access_token}}
        );
        if(check.ok){
          const rows=await check.json();
          isAdmin=rows.length>0;
        }
      }catch(e){}

      if(!isAdmin) throw new Error('Dieses Konto ist nicht als Kalender-Admin freigeschaltet.');

      sessionStorage.setItem('gf_admin_session',JSON.stringify(data));
      if(loginView) loginView.style.display='none';
      dashboard?.classList.add('visible');
      if(status) status.textContent='';
      if(typeof window.gfLoadAdminProposals==='function') window.gfLoadAdminProposals();
    }catch(err){
      if(status) status.textContent=err.message||'Anmeldung fehlgeschlagen.';
    }
  }

  if(loginBtn){
    const freshLogin=loginBtn.cloneNode(true);
    loginBtn.replaceWith(freshLogin);
    freshLogin.addEventListener('click',doLogin);
  }
  q('#adminPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

  logoutBtn?.addEventListener('click',()=>{
    sessionStorage.removeItem('gf_admin_session');
    dashboard?.classList.remove('visible');
    if(loginView) loginView.style.display='block';
    if(status) status.textContent='Abgemeldet.';
  });

  // Restore session visually
  try{
    const saved=JSON.parse(sessionStorage.getItem('gf_admin_session')||'null');
    if(saved?.access_token){
      if(loginView) loginView.style.display='none';
      dashboard?.classList.add('visible');
    }
  }catch(e){}

  // Re-classify right-side event rows by exact event data if possible, fallback by text.
  function classifyRows(){
    qa('.eventrow').forEach(row=>{
      const text=row.textContent.toLowerCase();
      let category='event';
      if(text.includes('ferien')) category='ferien';
      else if(text.includes('gottesdienst') || text.includes('sunday night') || text.includes('konfirmationsfeier')) category='gottesdienst';
      else if(text.includes('leiter') || text.includes('leaders one day') || text.includes('pastor- und leiter')) category='leitung';
      row.dataset.category=category;
    });
  }
  const observer=new MutationObserver(classifyRows);
  observer.observe(document.body,{childList:true,subtree:true});
  classifyRows();
})();
</script>


<script id="gf-v16-category-admin-js">
(function(){
  const q=(s,r=document)=>r.querySelector(s);
  const qa=(s,r=document)=>Array.from(r.querySelectorAll(s));

  const DEFAULT_NAMES={
    event:'Events',
    gottesdienst:'Gottesdienste',
    leitung:'Leitertermine',
    ferien:'Ferien'
  };

  function currentNames(){
    const out={...DEFAULT_NAMES};
    qa('[data-cat-name]').forEach(input=>{
      if(input.value.trim()) out[input.dataset.catName]=input.value.trim();
    });
    return out;
  }

  function applyNames(names){
    // Filter buttons
    qa('[data-cat-toggle]').forEach(btn=>{
      const key=btn.dataset.catToggle;
      if(!names[key]) return;
      const swatch=btn.querySelector('.category-swatch');
      btn.innerHTML='';
      if(swatch) btn.appendChild(swatch);
      else {
        const s=document.createElement('span');
        s.className='category-swatch';
        btn.appendChild(s);
      }
      btn.append(document.createTextNode(names[key]));
    });

    // Right event category badges
    const styleId='gf-dynamic-category-labels';
    let st=document.getElementById(styleId);
    if(!st){st=document.createElement('style');st.id=styleId;document.head.appendChild(st)}
    st.textContent=`
      .eventrow[data-category="event"]::after{content:"${names.event.replace(/"/g,'\\"')}"!important}
      .eventrow[data-category="gottesdienst"]::after{content:"${names.gottesdienst.replace(/"/g,'\\"')}"!important}
      .eventrow[data-category="leitung"]::after{content:"${names.leitung.replace(/"/g,'\\"')}"!important}
      .eventrow[data-category="ferien"]::after{content:"${names.ferien.replace(/"/g,'\\"')}"!important}
    `;

    // Proposal form options
    const select=q('#evCategory');
    if(select){
      Array.from(select.options).forEach(opt=>{
        if(names[opt.value]) opt.textContent=names[opt.value];
      });
    }
  }

  try{
    const saved=JSON.parse(localStorage.getItem('gf_category_names')||'null');
    if(saved){
      qa('[data-cat-name]').forEach(input=>{
        if(saved[input.dataset.catName]) input.value=saved[input.dataset.catName];
      });
      applyNames(saved);
    }
  }catch(e){}

  q('#saveCategoryNamesBtn')?.addEventListener('click', async ()=>{
    const names=currentNames();
    localStorage.setItem('gf_category_names',JSON.stringify(names));
    applyNames(names);

    const status=q('#categoryAdminStatus');
    if(status) status.textContent='Bezeichnungen lokal gespeichert ✓';

    // If admin session exists, also persist to Supabase calendar_categories
    let session=null;
    try{session=JSON.parse(sessionStorage.getItem('gf_admin_session')||'null')}catch(e){}
    if(!session?.access_token) return;

    try{
      for(const [slug,name] of Object.entries(names)){
        const res=await fetch(
          SUPABASE_URL+'/rest/v1/calendar_categories?slug=eq.'+encodeURIComponent(slug),
          {
            method:'PATCH',
            headers:{
              'apikey':SUPABASE_KEY,
              'Authorization':'Bearer '+session.access_token,
              'Content-Type':'application/json'
            },
            body:JSON.stringify({name})
          }
        );
        if(!res.ok) throw new Error('Speichern fehlgeschlagen');
      }
      if(status) status.textContent='Kategorien in Supabase gespeichert ✓';
    }catch(err){
      if(status) status.textContent='Lokal gespeichert; Supabase-Änderung konnte nicht gespeichert werden.';
    }
  });
})();
</script>
